apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: assetflow
spec:
  type: NodePort
  selector: {app: assetflow-frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: assetflow
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: assetflow-frontend}
  template:
    metadata:
      labels: {app: assetflow-frontend}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      containers:
        - name: frontend
          image: ghcr.io/jaehakim/assets-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 15
            periodSeconds: 15
          lifecycle:
            preStop: {exec: {command: [sh, -c, "sleep 5"]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      terminationGracePeriodSeconds: 20
