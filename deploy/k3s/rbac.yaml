apiVersion: v1
kind: ServiceAccount
metadata: {name: assetflow-monitor, namespace: assetflow}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: assetflow-monitor}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: assetflow-monitor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: assetflow-monitor}
subjects:
  - {kind: ServiceAccount, name: assetflow-monitor, namespace: assetflow}
