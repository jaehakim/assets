apiVersion: v1
kind: Secret
metadata:
  name: assetflow-secrets
  namespace: assetflow
type: Opaque
stringData:
  DB_PASSWORD: replace-with-a-long-random-password
  POSTGRES_PASSWORD: replace-with-the-same-password
  AGENT_REGISTRATION_TOKEN: replace-with-a-long-random-token
  AGENT_UPDATE_TOKEN: replace-with-a-long-random-token
  ADMIN_USERNAME: admin
  SOFTWARE_POLICY_API_KEY: ""
  ADMIN_PASSWORD: replace-with-a-long-random-password
