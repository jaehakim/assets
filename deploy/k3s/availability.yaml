apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: backend-pdb, namespace: assetflow}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: assetflow-backend}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: frontend-pdb, namespace: assetflow}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: assetflow-frontend}}
