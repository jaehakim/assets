apiVersion: v1
kind: ConfigMap
metadata:
  name: assetflow-config
  namespace: assetflow
data:
  DB_URL: jdbc:postgresql://postgres:5432/assetflow
  DB_USER: assetflow
  AGENT_RELEASE_DIRECTORY: /app/releases
  SESSION_COOKIE_SECURE: "true"
  POSTGRES_DB: assetflow
  POSTGRES_USER: assetflow
  SOFTWARE_POLICY_SOURCE_URL: ""
  SOFTWARE_POLICY_SOURCE_NAME: "공공기관 기초자료"
  SOFTWARE_POLICY_SYNC_CRON: "0 20 3 * * *"
  SYSTEM_INSPECTION_CRON: "0 10 6 * * *"
