# CR-S10: 버전 노출 제거
server_tokens off;
# CR-A01: 앞단 리버스 프록시(NPM, 노드 사설망) 뒤에 있으므로 X-Forwarded-For의 가장 오른쪽 비신뢰 주소를 클라이언트 IP로 삼는다.
#         이 설정이 없으면 $binary_remote_addr가 항상 프록시 IP라 limit_req가 전역 단일 버킷이 된다.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
# CR-S06 ①·CR-011: 등록·로그인 속도 제한 (키: 클라이언트 IP)
limit_req_zone $binary_remote_addr zone=af_register:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=af_login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CR-S07 ①: 기본 요청 본문 1MB, 경로별 예외만 상향
  client_max_body_size 1m;

  # CR-014: 보안 응답 헤더 (TLS는 앞단 프록시가 종료하므로 HSTS는 운영 프록시와 중복 적용해도 무해)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CR-015 완료(글꼴 셀프호스팅) 전까지 jsDelivr·Google Fonts만 허용. 이후 'self'로 축소한다.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /api/v1/agents/register {
    limit_req zone=af_register burst=20 nodelay;
    include /etc/nginx/conf.d/assetflow-proxy.inc;
  }
  location = /api/v1/auth/login {
    limit_req zone=af_login burst=5 nodelay;
    include /etc/nginx/conf.d/assetflow-proxy.inc;
  }
  location = /api/v1/agents/inventory {
    client_max_body_size 8m;
    include /etc/nginx/conf.d/assetflow-proxy.inc;
  }
  location = /api/v1/admin/agent-releases {
    client_max_body_size 200m;
    include /etc/nginx/conf.d/assetflow-proxy.inc;
  }
  location /api/ {
    include /etc/nginx/conf.d/assetflow-proxy.inc;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
