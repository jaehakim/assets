services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetflow}
      POSTGRES_USER: ${POSTGRES_USER:-assetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetflow-local-only}
    volumes: ["./deploy/postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-assetflow}
      DB_USER: ${POSTGRES_USER:-assetflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-assetflow-local-only}
      AGENT_REGISTRATION_TOKEN: ${AGENT_REGISTRATION_TOKEN:-change-me}
      AGENT_UPDATE_TOKEN: ${AGENT_UPDATE_TOKEN:-change-me-too}
      AGENT_RELEASE_DIRECTORY: /app/releases
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SOFTWARE_POLICY_SOURCE_URL: ${SOFTWARE_POLICY_SOURCE_URL:-}
      SOFTWARE_POLICY_SOURCE_NAME: ${SOFTWARE_POLICY_SOURCE_NAME:-공공기관 기초자료}
      SOFTWARE_POLICY_API_KEY: ${SOFTWARE_POLICY_API_KEY:-}
      SOFTWARE_POLICY_SYNC_CRON: ${SOFTWARE_POLICY_SYNC_CRON:-0 20 3 * * *}
    volumes: ["./deploy/agent-releases:/app/releases"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${WEB_PORT:-18080}:80"]
    depends_on: [backend]
networks:
  default: {name: assetflow}
